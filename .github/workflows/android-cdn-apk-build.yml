name: Build signed MaestroVPN APK only
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Preserve ordinary VPN engine
        run: git diff --exit-code 458fec7c885250f65d474204061dcdd60d71ee56 HEAD -- libbox-awg version.properties .github/workflows/libbox.yml
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: android-xhttp/go.mod
          cache-dependency-path: android-xhttp/go.sum
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'settings.gradle.kts', 'version.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Install pinned packaging toolchain
        run: |
          set -euo pipefail
          sdkmanager 'ndk;28.0.13004108' 'platforms;android-36' 'build-tools;36.0.0' >/dev/null
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/28.0.13004108" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/cdn-apk-inputs"
      - name: Build pinned XHTTP library for both ABIs without tests
        working-directory: android-xhttp
        env:
          CGO_ENABLED: '1'
          GOOS: android
        run: |
          set -euo pipefail
          toolchain="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for abi in arm64-v8a armeabi-v7a; do
            mkdir -p "../app/src/main/jniLibs/$abi"
            if [ "$abi" = arm64-v8a ]; then
              export GOARCH=arm64
              export CC="$toolchain/aarch64-linux-android23-clang"
              unset GOARM
            else
              export GOARCH=arm GOARM=7
              export CC="$toolchain/armv7a-linux-androideabi23-clang"
            fi
            library="../app/src/main/jniLibs/$abi/libmaestro_xhttp.so"
            # Android anet uses go:linkname, as does the existing olcRTC Android build.
            go build -mod=readonly -trimpath -buildmode=c-shared -ldflags='-s -w -checklinkname=0 -buildid= -extldflags=-Wl,-z,max-page-size=16384' -o "$library" .
            "$toolchain/llvm-nm" --defined-only -D "$library" > "$RUNNER_TEMP/cdn-apk-inputs/$abi.exports.txt"
            for symbol in JNI_OnLoad Java_com_maestrovpn_tv_whitelist_XhttpNative_nativeStart Java_com_maestrovpn_tv_whitelist_XhttpNative_nativeStop; do
              grep -q " $symbol$" "$RUNNER_TEMP/cdn-apk-inputs/$abi.exports.txt"
            done
          done
      - name: Reuse exact libbox artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/9203846250/zip" > "$RUNNER_TEMP/libbox.zip"
          python3 - <<'PY'
          import hashlib, os, pathlib, zipfile
          archive = pathlib.Path(os.environ['RUNNER_TEMP']) / 'libbox.zip'
          if hashlib.sha256(archive.read_bytes()).hexdigest() != 'baf1ae39b845601ef5291c92c9638261f4a9dfd7725d04ffd856431d48d42b37':
              raise SystemExit('libbox_archive_mismatch')
          with zipfile.ZipFile(archive) as z:
              members = [v for v in z.infolist() if pathlib.PurePosixPath(v.filename).name == 'libbox.aar']
              if len(members) != 1: raise SystemExit('libbox_member_mismatch')
              data = z.read(members[0])
          if hashlib.sha256(data).hexdigest() != 'c70ce917b331fd333d52b8e3c01eba2c2a343497f896fdf62c30436490a88f05':
              raise SystemExit('libbox_digest_mismatch')
          pathlib.Path('app/libs').mkdir(exist_ok=True)
          pathlib.Path('app/libs/libbox.aar').write_bytes(data)
          PY
      - name: Reuse existing olcRTC binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID=$(gh run list --workflow=olcrtc-bin.yml --status=success -b main -L1 --json databaseId -q '.[0].databaseId // empty')
          [ -n "$RUN_ID" ]
          gh run download "$RUN_ID" -n olcrtc-bin -D "$RUNNER_TEMP/olcrtc-bin"
          for abi in arm64-v8a armeabi-v7a; do
            cp "$RUNNER_TEMP/olcrtc-bin/libolcrtc-${abi}.so" "app/src/main/jniLibs/${abi}/libolcrtc.so"
          done
      - name: Materialize stable signing keystore
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          encoded = os.environ.get('SIGNING_KEYSTORE_B64', '')
          if not encoded or not os.environ.get('LOCAL_PROPERTIES'):
              raise SystemExit('stable_signing_secrets_required')
          raw = base64.b64decode(''.join(encoded.split()), validate=True)
          if not raw: raise SystemExit('stable_keystore_empty')
          with pathlib.Path('app/release.keystore').open('xb') as f:
              os.fchmod(f.fileno(), 0o600)
              f.write(raw)
          PY
      - name: Build signed APK 1.0.159 without test tasks
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleOtherDebug -PmaestroCdnApk=true --stacktrace --no-daemon
      - name: Require installable identity and fleet signing compatibility
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/other/debug -maxdepth 1 -type f -name '*.apk')
          [ "${#apks[@]}" -eq 1 ]
          apk="${apks[0]}"
          [ "$(apkanalyzer manifest application-id "$apk")" = 'com.maestrovpn.tv' ]
          [ "$(apkanalyzer manifest version-name "$apk")" = '1.0.159' ]
          [ "$(apkanalyzer manifest version-code "$apk")" = '1015900' ]
          [ "$(apkanalyzer manifest debuggable "$apk")" = 'false' ]
          signer="${ANDROID_SDK_ROOT}/build-tools/36.0.0/apksigner"
          "$signer" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/cdn-apk-inputs/signer.txt"
          mkdir -p "$RUNNER_TEMP/fleet-signers"
          gh release download tv-v1.0.157 --pattern 'MaestroVPN-TV-1.0.157-debug.apk' --dir "$RUNNER_TEMP/fleet-signers"
          curl --fail --location --max-time 180 'https://storage.yandexcloud.net/maestro-apk/MaestroVPN-TV-1.0.153-debug.apk' -o "$RUNNER_TEMP/fleet-signers/fleet-153.apk"
          for baseline in "$RUNNER_TEMP/fleet-signers"/*.apk; do
            "$signer" verify --print-certs "$baseline" > "$baseline.signer"
            diff -u <(grep 'certificate SHA-256 digest:' "$RUNNER_TEMP/cdn-apk-inputs/signer.txt") <(grep 'certificate SHA-256 digest:' "$baseline.signer")
          done
          echo 'Signature matches fleet versions 153 and 157.' > "$RUNNER_TEMP/cdn-apk-inputs/fleet-signature-match.txt"
          sha256sum "$apk" > "$RUNNER_TEMP/cdn-apk-inputs/apk.sha256"
          echo "path=$apk" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maestrovpn-cdn-159-${{ github.sha }}
          path: |
            ${{ steps.apk.outputs.path }}
            ${{ runner.temp }}/cdn-apk-inputs/
          if-no-files-found: error
          retention-days: 14
      - name: Remove runner signing file
        if: ${{ always() }}
        run: rm -f -- app/release.keystore
