name: Yandex CDN isolated release checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/yandex-cdn-release.yml'
      - 'backend/internal/release/**'
      - 'backend/cmd/maestro-release-validate/**'
      - 'ops/validate-yandex-cdn-release.ps1'
      - 'ops/validate-yandex-cdn-release.sh'
  push:
    paths:
      - '.github/workflows/yandex-cdn-release.yml'
      - 'backend/internal/release/**'
      - 'backend/cmd/maestro-release-validate/**'
      - 'ops/validate-yandex-cdn-release.ps1'
      - 'ops/validate-yandex-cdn-release.sh'

permissions:
  contents: read

jobs:
  release-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Validate Bash release wrapper syntax
        run: bash -n ops/validate-yandex-cdn-release.sh

      - name: Validate PowerShell release wrapper syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path -LiteralPath 'ops/validate-yandex-cdn-release.ps1').Path,
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -ne 0) {
            $parseErrors | ForEach-Object { $_.Message }
            exit 1
          }

      - name: Verify release Go formatting
        working-directory: backend
        run: |
          set -euo pipefail
          diff_file="$(mktemp)"
          gofmt -d internal/release cmd/maestro-release-validate >"${diff_file}"
          test ! -s "${diff_file}"

      - name: Test isolated release contracts
        working-directory: backend
        run: go test -count=1 ./internal/release ./cmd/maestro-release-validate

      - name: Race-test isolated release contracts
        working-directory: backend
        run: go test -count=1 -race ./internal/release ./cmd/maestro-release-validate

      - name: Vet isolated release contracts
        working-directory: backend
        run: go vet ./internal/release ./cmd/maestro-release-validate
