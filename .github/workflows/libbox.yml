name: Build libbox.aar

# Produces io.nekohasekai.libbox (libbox.aar) from SagerNet/sing-box, pinned to
# the ref in version.properties (SINGBOX_REF) — v1.14.4 for the 2026-11-17 TV
# core upgrade (naive/anytls stripped, AWG patch removed, see the sed step below).
# Build recipe is verbatim from sing-box's own Makefile:
#   make lib_install   -> installs github.com/sagernet/gomobile/{gomobile,gobind}@v0.1.13
#   make lib_android   -> go run ./cmd/internal/build_libbox -target android
# which runs `gomobile bind ... -androidapi 23 -javapkg=io.nekohasekai -libname=box
# -tags <sharedTags> ./experimental/libbox` -> writes libbox.aar (and libbox-legacy.aar).

on:
  push:
    paths:
      - version.properties
      - .github/workflows/libbox.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout our repo (for version.properties pin)
        uses: actions/checkout@v4

      - name: Load pinned versions from version.properties
        id: pin
        run: |
          set -euo pipefail
          # version.properties carries e.g. GO_VERSION=go1.25.11
          source <(grep -E '^(GO_VERSION|SINGBOX_REF|NDK_VERSION)=' version.properties)
          # actions/setup-go wants "1.25.11", version.properties has "go1.25.11"
          echo "go_version=${GO_VERSION#go}" >> "$GITHUB_OUTPUT"
          echo "singbox_ref=${SINGBOX_REF}"  >> "$GITHUB_OUTPUT"
          echo "ndk_version=${NDK_VERSION}"  >> "$GITHUB_OUTPUT"

      - name: Set up Go ${{ steps.pin.outputs.go_version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.pin.outputs.go_version }}
          check-latest: false

      # build_libbox/main.go fatals unless `java --version` reports "openjdk 17".
      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # его внутренний sdkmanager ставит удалённый legacy-пакет 'tools' и валит job до компиляции
      # (прогоны 37144736899, попытки 1 и 2, 03.10.2026).
      - name: Android SDK (preinstalled on the runner)
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          if [ -z "${SDK}" ] || [ ! -d "${SDK}" ]; then echo "::error::no preinstalled Android SDK"; exit 1; fi
          echo "ANDROID_SDK_ROOT=${SDK}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${SDK}" >> "$GITHUB_ENV"
          ls "${SDK}/cmdline-tools" || true

      # Cache resolved dependencies so a jitpack/CDN outage (compose-markdown and
      # libsu live ONLY on jitpack, which periodically 403s behind Cloudflare)
      # can't block a build once these have been fetched successfully once.

      # build_shared.findNDK() looks for $ANDROID_SDK_ROOT/ndk/<NDK_VERSION>;
      # install that exact revision and the cmdline-tools licenses it expects.
      - name: Install pinned Android NDK ${{ steps.pin.outputs.ndk_version }}
        run: |
          set -euo pipefail
          SDKM="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d "${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort | tail -1)"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "ndk;${{ steps.pin.outputs.ndk_version }}" "platform-tools" >/dev/null
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${{ steps.pin.outputs.ndk_version }}" >> "$GITHUB_ENV"

      - name: Clone sing-box at ${{ steps.pin.outputs.singbox_ref }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ steps.pin.outputs.singbox_ref }}" \
            https://github.com/SagerNet/sing-box.git sing-box
          echo "built ref:"; git -C sing-box rev-parse HEAD

      # Legacy-free core (task 17.11.2026): naive and anytls are removed from the build
      # entirely, and the panel's legacy tags (awg/naive/anytls/olcrtc/vk-turn/wdtt) are
      # stripped by the app before the config reaches the engine (WhiteListConfig.stripLegacy).
      # The panel keeps emitting those tags for older installs, so the engine must not even
      # try to register the removed protocols: unregistering here makes any stray reference
      # fail at compile time instead of at runtime.
      - name: Strip naive/anytls from sing-box
        run: |
          set -euo pipefail
          # 1) sharedTags: drop "with_naive_outbound" — it gates protocol/naive/outbound.go.
          sed -i 's/"with_utls", "with_naive_outbound"/"with_utls"/' \
            sing-box/cmd/internal/build_libbox/main.go
          # 2) the legacy-variant line no longer filters anything, and its comment follows.
          sed -i 's|// Build legacy variant (SDK 21, no naive outbound)|// Legacy variant: same tag set as the main build|' \
            sing-box/cmd/internal/build_libbox/main.go
          sed -i 's/legacyTags := filterTags(sharedTags, "with_naive_outbound")/legacyTags := sharedTags/' \
            sing-box/cmd/internal/build_libbox/main.go
          # 3) registry.go: unregister naive/anytls inbounds and the anytls outbound.
          #    registerNaiveOutbound stays: include/naive_outbound_stub.go (tag
          #    !with_naive_outbound) is now active and fails closed — a stray
          #    naive-outbound config is rejected, not silently accepted.
          sed -i '/"github.com\/sagernet\/sing-box\/protocol\/naive"/d' sing-box/include/registry.go
          sed -i '/"github.com\/sagernet\/sing-box\/protocol\/anytls"/d' sing-box/include/registry.go
          sed -i '/naive.RegisterInbound(registry)/d' sing-box/include/registry.go
          sed -i '/anytls.RegisterInbound(registry)/d' sing-box/include/registry.go
          sed -i '/anytls.RegisterOutbound(registry)/d' sing-box/include/registry.go
          # 4) quic.go: drop the blank naive/quic import (its transport must not compile in).
          sed -i '/_ "github.com\/sagernet\/sing-box\/protocol\/naive\/quic"/d' sing-box/include/quic.go
          # 5) verification: no naive/anytls reference may survive in the compiled set.
          #    registerNaiveOutbound is capital-N and does not match the grep — it is the stub.
          if grep -rnE 'naive|anytls' sing-box/include/registry.go \
              sing-box/cmd/internal/build_libbox/main.go sing-box/include/quic.go; then
            echo "::error::naive/anytls still referenced in the compiled set"; exit 1
          fi
          echo "naive/anytls fully removed from the compiled set"

      # Verbatim Makefile targets. lib_install installs gomobile+gobind @v0.1.13
      # into $(go env GOPATH)/bin; build_libbox calls $GOPATH/bin/gomobile directly,
      # so make sure that dir is on PATH (and ANDROID_HOME is set for SDK discovery).
      - name: make lib_install
        working-directory: sing-box
        run: make lib_install

      - name: make lib_android (gomobile bind -> libbox.aar)
        working-directory: sing-box
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          set -euo pipefail
          export PATH="$(go env GOPATH)/bin:$PATH"
          make lib_android

      - name: Show built artifacts
        working-directory: sing-box
        run: ls -lh libbox*.aar

      # sing-box v1.14.4 builds the non-legacy AAR with -androidapi 24, which
      # exceeds our app minSdk 23. Ship the legacy variant instead: with our strip
      # edits both variants carry the identical tag set (naive removed from
      # sharedTags, legacyTags := sharedTags), so legacy == full minus the API bump.
      - name: Upload libbox.aar
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: sing-box/libbox-legacy.aar
          if-no-files-found: error
