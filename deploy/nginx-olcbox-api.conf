server {
    listen 9443 ssl;
    listen [::]:9443 ssl;
    server_name wapmixx.ru;

    ssl_certificate     /etc/letsencrypt/live/wapmixx.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wapmixx.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Abuse-prone writes (signup creates registry rows; paid pings Telegram):
    # tighter limit with a small burst.
    location ~ ^/api/(signup|paid)$ {
        limit_req zone=olcbox_api burst=5 nodelay;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
    # Read-only endpoints (tariffs/status): looser.
    location /api/ {
        limit_req zone=olcbox_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
    # S3 node's 3x-ui panel, served over THIS host's auto-renewed certificate instead of S3's plain HTTP.
    # Upstream is the s3-panel-tunnel.service ssh forward (127.0.0.1:14798 -> S3 127.0.0.1:47989), so the
    # S1→S3 leg is encrypted as well. The path must stay identical to the panel's webBasePath, otherwise
    # 3x-ui answers 404. Connection/Upgrade are passed through verbatim: the panel uses websockets for live
    # stats, and a hardcoded "upgrade" would break ordinary requests.
    location /zupl22OeomNGALTc7Y/ {
        proxy_pass http://127.0.0.1:14798;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
    location = / { return 200 "ok\n"; }
    location / { return 404; }
}
