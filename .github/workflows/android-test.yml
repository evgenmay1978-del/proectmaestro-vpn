name: Build app APK (test / compile-check)

# Generic NON-OTA test build of the app on a feature branch, against the NORMAL
# libbox.aar (the fleet engine). Used to compile-check + optionally device-test app
# changes before merging them to main (which is what OTAs them).
#
# ⛔ SAFETY: NO GitHub Release → the OTA mirror never sees it. APK = artifact only
# (maestrovpn-tv-test-apk). HIGH versionCode so it won't self-update mid-test.
# Exception: the explicit mobile-release-only task publishes the pinned, reviewed
# stable APK artifact through GITHUB_TOKEN, without rebuilding or running tests.
# (ci trigger: target-1to1 — mockup medallions + status colors 2026-07-07)
# (ci trigger: target-1to1 v2 — full medallion ring + live under-glow 2026-07-07)
# (ci trigger: target-1to1 v3 — CTA gold + tile icons per mockup 2026-07-07)
# (ci trigger: target-1to1 v4 — top cartouche warm-grade + gilded ivy 2026-07-07)
# (ci trigger: target-1to1 v5 — tap-zone на орб (430,711,R228) + процедурный купол удалён (1:1 baked) 2026-07-07)
# (ci trigger: tv-eskiz unified-style swarm 2026-07-10)
# (ci trigger: tv-eskiz absolute-geometry fix 2026-07-10)
# (ci trigger: account-line + open-pay-page 2026-07-10)
# (ci trigger: tv-eskiz-redesign — ТВ-главный пиксель-в-пиксель по vpnon/vpnoff (кроп-кнопки+bg-кроссфейд) 2026-07-09)
# (ci trigger: ota-infinite-loop fix — await install verdict + versionCode compare + failure damper 2026-07-10)
# (ci trigger: ota-no-reinstall v2 — Shizuku→PACKAGE_INSTALLER fallback + foreground confirm re-fire + stale-session sweep 2026-07-10)

# (ci trigger: premium TV interface 2026-07-17)

on:
  workflow_dispatch:
    inputs:
      task:
        description: Manual task to run on the selected ref
        required: true
        default: android
        type: choice
        options:
          - android
          - cdn-apk-build-only
          - mobile-approved-screens
          - mobile-ui-validation
          - mobile-ui-only
          - mobile-ring-preview
          - mobile-new-customer-only
          - mobile-release-only
          - reserve-measure
          - xhttp-native
          - cdn-runtime-test-apk
      phone_cdn_checks:
        description: Run focused mobile CDN checks with the signed candidate
        type: boolean
        default: false
      phone_flow_checks:
        description: Run phone navigation and purchase flows with the native preview
        type: boolean
        default: false
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/android-test.yml'
  push:
    paths:
      - .github/workflows/android-test.yml

jobs:
  mobile-release-only:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'mobile-release-only' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    concurrency:
      group: mobile-release-160
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Publish the reviewed APK without rebuilding
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess, zipfile

          source = 'e0b737d864e86062e1e5c3fe2fdfb26e663130f8'
          run_id, artifact_id = 34422480557, 10131540365
          archive_sha = 'd8aaff44601ebe471f99c5e934bf45d1337d8753fef6e797ba20ad2c0d0649eb'
          tag, apk_name = 'tv-v1.0.160', 'MaestroVPN-TV-1.0.160-debug.apk'
          repo = os.environ['GH_REPO']

          def api(path, method='GET', payload=None, missing_ok=False):
              command = ['gh', 'api', f'repos/{repo}{path}', '--method', method]
              if payload is not None:
                  command += ['--input', '-']
              result = subprocess.run(command, input=None if payload is None else json.dumps(payload),
                                      text=True, capture_output=True)
              if result.returncode:
                  if missing_ok and 'HTTP 404' in result.stderr:
                      return None
                  raise RuntimeError(result.stderr)
              return json.loads(result.stdout)

          def digest(path):
              h = hashlib.sha256()
              with path.open('rb') as f:
                  while chunk := f.read(1048576):
                      h.update(chunk)
              return h.hexdigest()

          run = api(f'/actions/runs/{run_id}')
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['head_sha'] == source
          artifact = api(f'/actions/artifacts/{artifact_id}')
          assert artifact['name'] == 'maestrovpn-mobile-160-' + source and not artifact['expired']
          assert artifact['workflow_run']['id'] == run_id and artifact['workflow_run']['head_sha'] == source
          assert artifact['digest'] == 'sha256:' + archive_sha
          archive = pathlib.Path('build.zip')
          with archive.open('wb') as output:
              subprocess.run(['gh', 'api', f'repos/{repo}/actions/artifacts/{artifact_id}/zip'],
                             stdout=output, check=True)
          assert digest(archive) == archive_sha
          apk = pathlib.Path(apk_name)
          with zipfile.ZipFile(archive) as z:
              apk_entry, = [n for n in z.namelist() if n.endswith('.apk')]
              sha_entry, = [n for n in z.namelist() if pathlib.PurePosixPath(n).name == 'apk.sha256']
              assert pathlib.PurePosixPath(apk_entry).name == apk_name
              expected_sha = z.read(sha_entry).decode().split()[0]
              with z.open(apk_entry) as input_file, apk.open('wb') as output:
                  shutil.copyfileobj(input_file, output)
          assert digest(apk) == expected_sha
          metadata = pathlib.Path('version-metadata.json')
          metadata.write_text(json.dumps(dict(version_code=1016001, version_name='1.0.160')), encoding='utf-8')
          files = (apk, metadata)

          ref = api('/git/ref/tags/' + tag, missing_ok=True)
          if ref is not None:
              target = ref['object']
              while target['type'] == 'tag':
                  target = api('/git/tags/' + target['sha'])['object']
              assert target['type'] == 'commit' and target['sha'] == source, 'Existing tag has a different source'
          release = api('/releases/tags/' + tag, missing_ok=True)
          if release is None:
              release = api('/releases', 'POST', dict(tag_name=tag, target_commitish=source,
                  name='MaestroVPN 1.0.160', draft=True, prerelease=False,
                  body='Утверждённый мобильный вид с резной шапкой и золотыми рамами. '
                       'Вход по логину и смена аккаунта, действительный остаток CDN. '
                       'Исправлены вход и сохранение выбора приложений.'))
          assert release['target_commitish'] == source, 'Existing release has a different source'
          for file in files:
              existing = [a for a in release['assets'] if a['name'] == file.name]
              if existing:
                  assert len(existing) == 1
                  assert existing[0]['size'] == file.stat().st_size
                  assert existing[0].get('digest') == 'sha256:' + digest(file), 'Existing asset differs'
              else:
                  subprocess.run(['gh', 'release', 'upload', tag, str(file)], check=True)
          uploaded = api('/releases/' + str(release['id']))
          assert uploaded['target_commitish'] == source
          for file in files:
              asset, = [a for a in uploaded['assets'] if a['name'] == file.name]
              assert asset['size'] == file.stat().st_size and asset.get('digest') == 'sha256:' + digest(file)
          subprocess.run(['gh', 'release', 'edit', tag, '--draft=false', '--prerelease=false', '--latest'], check=True)
          published = api('/releases/' + str(release['id']))
          assert not published['draft'] and not published['prerelease']
          print(json.dumps(dict(release=published['html_url'], source=source, run=run_id,
                                artifact=artifact_id, size=apk.stat().st_size, sha256=expected_sha)))
          PY

  mobile-ui-only:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'mobile-ui-only' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/android-cdn-apk-build.yml
    with:
      emulator_review: true
      emulator_only: true
    secrets: inherit

  mobile-ring-preview:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'mobile-ring-preview' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/android-cdn-apk-build.yml
    with:
      emulator_review: true
      emulator_only: false
      visual_preview: true
      phone_cdn_checks: ${{ inputs.phone_cdn_checks == true }}
      phone_flow_checks: ${{ inputs.phone_flow_checks == true }}
    secrets: inherit

  mobile-new-customer-only:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'mobile-new-customer-only' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/android-cdn-apk-build.yml
    with:
      emulator_review: true
      emulator_only: true
      new_customer_only: true
    secrets: inherit

  mobile-ui-validation:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'mobile-ui-validation' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/android-cdn-apk-build.yml
    with:
      emulator_review: true
    secrets: inherit

  mobile-approved-screens:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'mobile-approved-screens' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/android-cdn-apk-build.yml
    with:
      capture_only: true
    secrets: inherit

  cdn-apk-build-only:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'cdn-apk-build-only' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/android-cdn-apk-build.yml
    with:
      phone_cdn_checks: ${{ inputs.phone_cdn_checks == true }}
    secrets: inherit

  cdn-runtime-test-apk:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'cdn-runtime-test-apk' }}
    needs: xhttp-native
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Read NDK pin
        id: ndk
        run: |
          set -euo pipefail
          source <(grep -E '^NDK_VERSION=' version.properties)
          test -n "${NDK_VERSION:-}"
          echo "version=${NDK_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install pinned Android toolchain
        run: |
          set -euo pipefail
          sdkmanager \
            "ndk;${{ steps.ndk.outputs.version }}" \
            "platforms;android-36" \
            "build-tools;36.0.0" >/dev/null
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${{ steps.ndk.outputs.version }}" >> "$GITHUB_ENV"

      - name: Fetch and verify exact libbox artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          readonly LIBBOX_RUN_ID='31758418005'
          readonly LIBBOX_ARTIFACT_ID='9203846250'
          readonly LIBBOX_ZIP_SHA256='baf1ae39b845601ef5291c92c9638261f4a9dfd7725d04ffd856431d48d42b37'
          readonly LIBBOX_AAR_SHA256='c70ce917b331fd333d52b8e3c01eba2c2a343497f896fdf62c30436490a88f05'
          metadata_path="${RUNNER_TEMP}/libbox-artifact.json"
          zip_path="${RUNNER_TEMP}/libbox-artifact.zip"
          extract_dir="${RUNNER_TEMP}/libbox-artifact"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${LIBBOX_ARTIFACT_ID}" > "$metadata_path"
          python - "$metadata_path" "$LIBBOX_RUN_ID" "$LIBBOX_ARTIFACT_ID" <<'PY'
          import json
          import pathlib
          import sys

          artifact = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          if artifact.get("id") != int(sys.argv[3]):
              raise SystemExit("libbox_artifact_id_mismatch")
          workflow_run = artifact.get("workflow_run") or {}
          if workflow_run.get("id") != int(sys.argv[2]):
              raise SystemExit("libbox_workflow_run_mismatch")
          if artifact.get("expired") is not False:
              raise SystemExit("libbox_artifact_expired")
          PY
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${LIBBOX_ARTIFACT_ID}/zip" > "$zip_path"
          printf '%s  %s\n' "$LIBBOX_ZIP_SHA256" "$zip_path" | sha256sum -c -
          mkdir -p "$extract_dir" app/libs
          unzip -q "$zip_path" -d "$extract_dir"
          mapfile -t aar_files < <(find "$extract_dir" -type f -name 'libbox.aar' -print)
          if [ "${#aar_files[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one libbox.aar in pinned artifact." >&2
            exit 1
          fi
          printf '%s  %s\n' "$LIBBOX_AAR_SHA256" "${aar_files[0]}" | sha256sum -c -
          cp "${aar_files[0]}" app/libs/libbox.aar

      - name: Fetch and verify native libraries from this exact run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          native_root="$RUNNER_TEMP/native-input"
          mkdir "$native_root"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" > "$native_root/artifacts.json"
          python3 - "$native_root" <<'PY'
          import json, os, pathlib
          root = pathlib.Path(__import__('sys').argv[1])
          artifacts = json.loads((root / 'artifacts.json').read_text())['artifacts']
          matches = [a for a in artifacts if a['name'] == 'maestro-xhttp-native-' + os.environ['GITHUB_SHA']]
          assert len(matches) == 1 and matches[0]['expired'] is False
          a = matches[0]
          assert a['workflow_run']['id'] == int(os.environ['GITHUB_RUN_ID'])
          assert a['workflow_run']['head_sha'] == os.environ['GITHUB_SHA']
          assert a['digest'].startswith('sha256:') and len(a['digest']) == 71
          (root / 'artifact-id').write_text(str(a['id']))
          (root / 'expected-sha256').write_text(a['digest'][7:])
          PY
          artifact_id="$(cat "$native_root/artifact-id")"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$native_root/native.zip"
          python3 - "$native_root" <<'PY'
          import hashlib, json, os, pathlib, struct, sys, zipfile
          root = pathlib.Path(sys.argv[1])
          archive = root / 'native.zip'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == (root / 'expected-sha256').read_text()
          with zipfile.ZipFile(archive) as z:
              assert len(z.namelist()) == len(set(z.namelist()))
              info = z.getinfo('manifest.json')
              assert info.file_size <= 16384
              manifest = json.loads(z.read(info))
              assert manifest['schema_version'] == 1 and manifest['source_commit'] == os.environ['GITHUB_SHA']
              assert manifest['xray_commit'] == '5ca6f4b7d4dc20a881d4330e498892697627ec0c'
              assert manifest['ndk'] == '28.0.13004108' and manifest['android_api'] == 23
              libraries = manifest['libraries']
              assert len(libraries) == 2 and {x['abi'] for x in libraries} == {'arm64-v8a', 'armeabi-v7a'}
              for lib in libraries:
                  abi = lib['abi']
                  name = abi + '/libmaestro_xhttp.so'
                  assert lib['path'] == name and 0 < lib['bytes'] <= 64 * 1024 * 1024
                  assert z.getinfo(name).file_size == lib['bytes']
                  data = z.read(name)
                  assert hashlib.sha256(data).hexdigest() == lib['sha256']
                  assert data[:4] == b'\x7fELF' and data[5] == 1
                  assert data[4] == (2 if abi == 'arm64-v8a' else 1)
                  assert struct.unpack_from('<H', data, 18)[0] == (183 if abi == 'arm64-v8a' else 40)
                  destination = pathlib.Path('app/src/main/jniLibs') / abi / 'libmaestro_xhttp.so'
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  with destination.open('xb') as output:
                      output.write(data)
          (root / 'verified-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY

      - name: Test actual CDN app integration contracts
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testOtherDebugUnitTest \
            --tests '*WhiteListRuntimeTest' \
            --tests '*WhiteListConfigTest' \
            --tests '*WhiteListAndroidBoundaryTest' \
            --tests '*WhiteListBalanceTest' \
            --tests '*ProtocolVisibilityTest' \
            --tests '*PhoneHomeProtocolOrderTest' \
            --tests '*PhoneHomeControlDeckContractTest' \
            -PmaestroTask7TestVersionName=1.0.158-task7-test \
            -PmaestroTask7TestVersionCode=1015800 \
            --stacktrace --no-daemon

      - name: Build separately versioned Task 7 APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew \
            :app:assembleOtherDebug \
            -PmaestroTask7TestVersionName=1.0.158-task7-test \
            -PmaestroTask7TestVersionCode=1015800 \
            --stacktrace \
            --no-daemon

      - name: Verify Task 7 APK metadata and signer
        id: apk
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/other/debug -maxdepth 1 -type f -name '*.apk' -print)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one Task 7 APK." >&2
            exit 1
          fi
          apk="${apks[0]}"
          test "$(apkanalyzer manifest application-id "$apk")" = 'com.maestrovpn.tv'
          test "$(apkanalyzer manifest version-name "$apk")" = '1.0.158-task7-test'
          test "$(apkanalyzer manifest version-code "$apk")" = '1015800'
          test "$(apkanalyzer manifest debuggable "$apk")" = 'false'
          apksigner="${ANDROID_SDK_ROOT}/build-tools/36.0.0/apksigner"
          test -x "$apksigner"
          signer_report="${RUNNER_TEMP}/task7-apk-signer.txt"
          "$apksigner" verify --verbose --print-certs "$apk" | tee "$signer_report"
          python - "$signer_report" <<'PY'
          import pathlib
          import sys

          report = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          if "CN=Android Debug" not in report:
              raise SystemExit("task7_apk_not_debug_signed")
          PY
          sha256sum "$apk" | tee "${RUNNER_TEMP}/task7-apk.sha256"
          echo "apk_path=${apk}" >> "$GITHUB_OUTPUT"

      - name: Upload Task 7 APK artifact only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maestrovpn-cdn-runtime-test-${{ github.sha }}
          path: |
            ${{ steps.apk.outputs.apk_path }}
            ${{ runner.temp }}/task7-apk.sha256
            ${{ runner.temp }}/native-input/verified-manifest.json
          if-no-files-found: error
          retention-days: 7

  xhttp-native:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.task == 'xhttp-native' || inputs.task == 'cdn-runtime-test-apk') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: android-xhttp/go.mod
          cache-dependency-path: android-xhttp/go.sum
      - name: Test native lifecycle and protected socket boundary
        working-directory: android-xhttp
        run: |
          set -euo pipefail
          test -z "$(gofmt -l *.go)"
          go test -mod=readonly -count=1 ./...
          go test -mod=readonly -count=1 -race ./...
          go vet -mod=readonly ./...
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android NDK
        run: |
          set -euo pipefail
          sdkmanager "ndk;28.0.13004108" >/dev/null
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/28.0.13004108" >> "$GITHUB_ENV"
      - name: Build both Android ABIs and verify JNI exports
        working-directory: android-xhttp
        env:
          CGO_ENABLED: '1'
          GOOS: android
        run: |
          set -euo pipefail
          toolchain="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for abi in arm64-v8a armeabi-v7a; do
            mkdir -p "../dist/xhttp-native/$abi"
            if [ "$abi" = arm64-v8a ]; then
              export GOARCH=arm64
              export CC="$toolchain/aarch64-linux-android23-clang"
              unset GOARM
            else
              export GOARCH=arm GOARM=7
              export CC="$toolchain/armv7a-linux-androideabi23-clang"
            fi
            library="../dist/xhttp-native/$abi/libmaestro_xhttp.so"
            go build -mod=readonly -trimpath -buildmode=c-shared \
              -ldflags='-s -w -buildid= -extldflags=-Wl,-z,max-page-size=16384' -o "$library" .
            "$toolchain/llvm-nm" --defined-only -D "$library" > "../dist/xhttp-native/$abi/exports.txt"
            for symbol in JNI_OnLoad Java_com_maestrovpn_tv_whitelist_XhttpNative_nativeStart Java_com_maestrovpn_tv_whitelist_XhttpNative_nativeStop; do
              grep -q " $symbol$" "../dist/xhttp-native/$abi/exports.txt"
            done
            "$toolchain/llvm-readelf" -h -l "$library" > "../dist/xhttp-native/$abi/elf.txt"
          done
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          root = Path('../dist/xhttp-native')
          libraries = []
          for abi in ('arm64-v8a', 'armeabi-v7a'):
              p = root / abi / 'libmaestro_xhttp.so'
              libraries.append({'abi': abi, 'path': p.relative_to(root).as_posix(),
                                'bytes': p.stat().st_size, 'sha256': hashlib.sha256(p.read_bytes()).hexdigest()})
          manifest = {'schema_version': 1, 'source_commit': os.environ['GITHUB_SHA'],
                      'xray_commit': '5ca6f4b7d4dc20a881d4330e498892697627ec0c',
                      'ndk': '28.0.13004108', 'android_api': 23, 'libraries': libraries,
                      'device_runtime_proven': False, 'apk_created': False}
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Upload exact-source native libraries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maestro-xhttp-native-${{ github.sha }}
          path: dist/xhttp-native/
          if-no-files-found: error
          retention-days: 14

  reserve-measure:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'reserve-measure' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test measurement command and authenticated client boundary
        working-directory: backend
        run: |
          set -euo pipefail
          test -z "$(gofmt -l cmd/maestro-reserve-measure/*.go)"
          go test -count=1 ./cmd/maestro-reserve-measure ./internal/sidecaragentclient
          go test -count=1 -race ./cmd/maestro-reserve-measure ./internal/sidecaragentclient
          go vet ./cmd/maestro-reserve-measure ./internal/sidecaragentclient

      - name: Build standalone read-only measurement binary
        working-directory: backend
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          mkdir -p ../dist/reserve-measure
          go build -trimpath -ldflags='-s -w -buildid=' -o ../dist/reserve-measure/maestro-reserve-measure ./cmd/maestro-reserve-measure
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          root = Path('../dist/reserve-measure')
          binary = root / 'maestro-reserve-measure'
          digest = hashlib.sha256(binary.read_bytes()).hexdigest()
          manifest = {
              'schema_version': 1,
              'source_commit': os.environ['GITHUB_SHA'],
              'purpose': 'isolated-read-only-reserve-measurement',
              'os': 'linux',
              'arch': 'amd64',
              'binary': binary.name,
              'bytes': binary.stat().st_size,
              'sha256': digest,
          }
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          (root / 'SHA256SUMS').write_text(digest + '  ' + binary.name + '\n', encoding='ascii')
          PY

      - name: Upload exact-source measurement artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maestro-reserve-measure-${{ github.sha }}
          path: dist/reserve-measure/
          if-no-files-found: error
          retention-days: 14

  build:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.task == 'android' }}
    runs-on: ubuntu-latest
    # The repo default token permission is "read", which does NOT include actions:read — so
    # `gh run list --workflow=libbox.yml` (the libbox.aar fetch below) failed with
    # "HTTP 403: Resource not accessible by integration" and the job died before compiling
    # anything (run 30406565486, 2026-07-28). Grant it explicitly.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Set test version (HIGH code so the OTA never replaces it)
        id: ver
        run: |
          set -euo pipefail
          VC="$(( 90000 + ${{ github.run_number }} ))"
          VN="1.0.92-test"
          sed -i -E "s/^VERSION_CODE=.*/VERSION_CODE=${VC}/" version.properties
          sed -i -E "s/^VERSION_NAME=.*/VERSION_NAME=${VN}/" version.properties

      - name: Read NDK pin from version.properties
        id: pin
        run: |
          set -euo pipefail
          source <(grep -E '^NDK_VERSION=' version.properties)
          echo "ndk_version=${NDK_VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'settings.gradle.kts', 'version.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install pinned NDK + SDK platform
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;${{ steps.pin.outputs.ndk_version }}" "platforms;android-36" "build-tools;36.0.0" >/dev/null
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${{ steps.pin.outputs.ndk_version }}" >> "$GITHUB_ENV"

      - name: Fetch the NORMAL libbox.aar (latest successful libbox.yml run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p app/libs
          RUN_ID=$(gh run list --workflow=libbox.yml --status=success -L1 \
            --json databaseId -q '.[0].databaseId // empty')
          [ -n "$RUN_ID" ] || { echo "::error::No successful libbox.yml build found." >&2; exit 1; }
          gh run download "$RUN_ID" -n libbox-aar -D app/libs
          test -f app/libs/libbox.aar
          ls -lh app/libs/

      - name: Fetch olcrtc android binaries → jniLibs (option-b; NON-FATAL)
        # Option-b ships olcRTC as a separate-process native binary in jniLibs/<abi>/libolcrtc.so
        # (NOT the old gomobile .aar, which collided with libbox's go.* runtime). Non-fatal so a
        # broken olcrtc-bin.yml never blocks the app compile-check.
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          set -euo pipefail
          RUN_ID=$(gh run list --workflow=olcrtc-bin.yml --status=success -L1 \
            --json databaseId -q '.[0].databaseId // empty')
          [ -n "$RUN_ID" ] || { echo "::warning::No successful olcrtc-bin.yml run — compiling without the binary." >&2; exit 0; }
          gh run download "$RUN_ID" -n olcrtc-bin -D olcrtc-bin
          for abi in arm64-v8a armeabi-v7a; do
            [ -f "olcrtc-bin/libolcrtc-${abi}.so" ] || continue
            mkdir -p "app/src/main/jniLibs/${abi}"
            cp "olcrtc-bin/libolcrtc-${abi}.so" "app/src/main/jniLibs/${abi}/libolcrtc.so"
          done
          ls -lhR app/src/main/jniLibs/ 2>/dev/null || true

      - name: Fetch WDTT mobile transport binaries → jniLibs (required)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID=$(gh run list --workflow=wdtt-bin.yml --status=success -L1 --json databaseId -q '.[0].databaseId // empty')
          [ -n "$RUN_ID" ] || { echo "::error::No successful wdtt-bin.yml artifact." >&2; exit 1; }
          gh run download "$RUN_ID" -n wdtt-bin -D wdtt-bin
          source <(grep -E '^WDTT_REF=' version.properties)
          test "$(cat wdtt-bin/WDTT_UPSTREAM_COMMIT)" = "$WDTT_REF"
          (cd wdtt-bin && sha256sum -c wdtt-sha256.txt)
          for abi in arm64-v8a armeabi-v7a; do
            test -s "wdtt-bin/libwdtt-${abi}.so"
            mkdir -p "app/src/main/jniLibs/${abi}"
            cp "wdtt-bin/libwdtt-${abi}.so" "app/src/main/jniLibs/${abi}/libwdtt.so"
          done

      - name: Materialize the stable signing keystore from secret
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${SIGNING_KEYSTORE_B64:-}" ]; then
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > app/release.keystore
          fi

      - name: Build :app:assembleOtherDebug
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          # Preserve the first failure; retry only after its cause is corrected.
          ./gradlew :app:assembleOtherDebug --stacktrace --no-daemon

      # Та же причина, что в android.yml: выгрузка — удобство, а не результат гейта. Пока квота
      # артефактов выбрана, её падение уводило ИДУЩИЕ ПОСЛЕ unit-тесты в skipped, и гейт переставал
      # проверять то, ради чего существует. Сборка и тесты остаются блокирующими.
      - name: Upload test APK (artifact only — NO Release, NO OTA)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: maestrovpn-tv-test-apk
          path: app/build/outputs/apk/other/debug/*.apk
          if-no-files-found: error

      # The repo has unit tests (MaestroSubTest, WdttManagerTest, WdttVpnPolicyTest,
      # ProtocolLabelTest) that no workflow has ever executed — this job only ever ran
      # assembleOtherDebug, so they were dead weight. Run them AFTER the APK upload so a test
      # failure can never cost us the artifact we came here for.
      #
      # Gating: run 30167294888 (2026-07-25) was the first time these ever executed anywhere and
      # all of them passed, so a failure from here on is a real regression, not unknown ground.
      - name: Unit tests
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: ./gradlew :app:testOtherDebugUnitTest --stacktrace --no-daemon

      - name: Upload unit-test report
        if: always()
        continue-on-error: true # тоже выгрузка: не должна ронять гейт из-за квоты артефактов
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testOtherDebugUnitTest/
          if-no-files-found: ignore

