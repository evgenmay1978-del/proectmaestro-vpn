name: Isolated sidecar agent checks

on:
  workflow_dispatch:
    inputs:
      task:
        description: Select the existing commercial bundle or the isolated session-fence source proof
        required: true
        default: commercial-bundle
        type: choice
        options:
          - commercial-bundle
          - runtime-fence-proof
          - runtime-module-graph
  pull_request:
    paths:
      - '.github/workflows/sidecar-agent.yml'
      - 'sidecar-agent/**'
      - 'backend/internal/release/templates.go'
      - 'backend/internal/release/handler_service_test.go'
      - 'deploy/maestro-xray-cdn-agent.service'
      - 'deploy/maestro-xray-cdn-agent.env.example'
      - 'scripts/tests/test_sidecar_agent_ci.py'
  push:
    paths:
      - '.github/workflows/sidecar-agent.yml'
      - 'sidecar-agent/**'
      - 'backend/internal/release/templates.go'
      - 'backend/internal/release/handler_service_test.go'
      - 'deploy/maestro-xray-cdn-agent.service'
      - 'deploy/maestro-xray-cdn-agent.env.example'
      - 'scripts/tests/test_sidecar_agent_ci.py'

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate sidecar workflow policy
        run: python -m unittest scripts.tests.test_sidecar_agent_ci -v

  sidecar:
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: sidecar-agent/go.mod
          cache-dependency-path: sidecar-agent/go.sum
      - name: Test sidecar agent
        if: inputs.task != 'runtime-module-graph'
        working-directory: sidecar-agent
        run: go test -count=1 ./...
      - name: Verify sidecar formatting
        if: inputs.task != 'runtime-module-graph'
        working-directory: sidecar-agent
        run: test -z "$(gofmt -l .)"
      - name: Race-test sidecar agent
        if: inputs.task != 'runtime-module-graph'
        working-directory: sidecar-agent
        run: go test -race -count=1 ./...
      - name: Vet sidecar agent
        if: inputs.task != 'runtime-module-graph'
        working-directory: sidecar-agent
        run: go vet ./...

      - name: Resolve runtime module graph without compiling or testing
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'runtime-module-graph'
        working-directory: sidecar-agent
        run: |
          set -euo pipefail
          umask 077
          go mod tidy
          mkdir -p ../dist-runtime-module-graph
          cp go.mod go.sum ../dist-runtime-module-graph/
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          root = Path('../dist-runtime-module-graph')
          manifest = {'schema_version': 1, 'source_commit': os.environ['GITHUB_SHA'],
                      'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
                      'purpose': 'module-metadata-only-no-build-or-test',
                      'files': [{'path': p.name, 'sha256': hashlib.sha256(p.read_bytes()).hexdigest()}
                                for p in (root / 'go.mod', root / 'go.sum')]}
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY

      - name: Upload generated runtime module metadata
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'runtime-module-graph'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maestro-runtime-module-graph-${{ github.sha }}
          path: dist-runtime-module-graph/
          if-no-files-found: error
          retention-days: 7

      - name: Build isolated managed-session runtime proof
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'runtime-fence-proof'
        working-directory: sidecar-agent
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ../dist-runtime-fence
          go build -mod=readonly -trimpath -ldflags='-s -w -buildid=' \
            -o ../dist-runtime-fence/maestro-xray-cdn-runtime ./cmd/maestro-xray-cdn-runtime
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          root = Path('../dist-runtime-fence')
          binary = root / 'maestro-xray-cdn-runtime'
          data = binary.read_bytes()
          assert data[:6] == b'\x7fELF\x02\x01' and int.from_bytes(data[18:20], 'little') == 62
          digest = hashlib.sha256(data).hexdigest()
          manifest = {
              'schema_version': 1,
              'source_commit': os.environ['GITHUB_SHA'],
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'xray_source_commit': '1bdb488c9ec09ea51e6899697d5b7437f3cf6eb2',
              'purpose': 'managed-session-fence-source-proof',
              'deployable_commercial_bundle': False,
              'agent_control_wiring_proven': False,
              'binary': binary.name,
              'bytes': len(data),
              'sha256': digest,
          }
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          (root / 'SHA256SUMS').write_text(digest + '  ' + binary.name + '\n')
          PY

      - name: Upload isolated runtime proof artifact
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'runtime-fence-proof'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maestro-xray-session-fence-proof-${{ github.sha }}
          path: dist-runtime-fence/
          if-no-files-found: error
          retention-days: 14

      - name: Build immutable Linux amd64 commercial bundle
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'commercial-bundle'
        env:
          LC_ALL: C
          XRAY_ARCHIVE_SHA256: f56c106b7c0159ad386bccd340faa5bbf55fd5c15821ec9e63e6a6ba11d3d1c7
          XRAY_VERSION: 26.5.9
        run: |
          set -euo pipefail
          umask 077
          build_a="$RUNNER_TEMP/commercial-agent-a"
          build_b="$RUNNER_TEMP/commercial-agent-b"
          archive="$RUNNER_TEMP/Xray-linux-64.zip"
          extracted="$RUNNER_TEMP/xray-extracted"
          dist="$GITHUB_WORKSPACE/dist-commercial"
          test ! -e "$build_a"
          test ! -e "$build_b"
          test ! -e "$dist"
          (
            cd sidecar-agent
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=true -ldflags '-s -w' -o "$build_a" ./cmd/maestro-xray-cdn-agent
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=true -ldflags '-s -w' -o "$build_b" ./cmd/maestro-xray-cdn-agent
          )
          cmp -- "$build_a" "$build_b"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-linux-64.zip"
          printf '%s  %s\n' "$XRAY_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
          mkdir -m 700 -- "$extracted" "$dist"
          unzip -q "$archive" xray -d "$extracted"
          chmod 0755 "$extracted/xray"
          readelf -h "$extracted/xray" | grep -F 'Class:' | grep -F 'ELF64'
          readelf -h "$extracted/xray" | grep -F 'Machine:' | grep -F 'Advanced Micro Devices X86-64'
          "$extracted/xray" version | grep -F "Xray ${XRAY_VERSION}"
          install -d -m 0755 "$dist/bin" "$dist/lib" "$dist/templates" "$dist/systemd" "$dist/sysusers"
          install -m 0755 "$extracted/xray" "$dist/bin/xray"
          install -m 0755 "$build_a" "$dist/bin/maestro-xray-cdn-agent"
          install -m 0755 ops/yandex_cdn_commercial/operator.py "$dist/bin/maestro-xray-cdn-commercial-operator"
          install -m 0644 ops/yandex_cdn_commercial/bundle.py "$dist/lib/commercial_bundle.py"
          install -m 0644 ops/yandex_cdn_commercial/templates/config.json.tmpl "$dist/templates/config.json.tmpl"
          install -m 0644 ops/yandex_cdn_commercial/systemd/maestro-xray-cdn-commercial.service "$dist/systemd/maestro-xray-cdn-commercial.service"
          install -m 0644 ops/yandex_cdn_commercial/systemd/maestro-xray-cdn-commercial-agent.service "$dist/systemd/maestro-xray-cdn-commercial-agent.service"
          install -m 0644 ops/yandex_cdn_commercial/sysusers/maestro-xray-cdn-commercial.conf "$dist/sysusers/maestro-xray-cdn-commercial.conf"
          install -m 0644 ops/yandex_cdn_commercial/rollback.json "$dist/rollback.json"
          python ops/yandex_cdn_commercial/bundle.py create \
            --bundle "$dist" \
            --source-commit "$GITHUB_SHA" \
            --xray-version "$XRAY_VERSION" \
            --xray-archive-sha256 "$XRAY_ARCHIVE_SHA256"
          python ops/yandex_cdn_commercial/bundle.py verify --bundle "$dist"

      - name: Upload immutable commercial bundle
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'commercial-bundle'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maestro-xray-cdn-commercial-${{ github.sha }}
          path: dist-commercial
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          include-hidden-files: false

  release-template:
    if: inputs.task != 'runtime-module-graph'
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Test HandlerService release template
        working-directory: backend
        run: go test -count=1 ./internal/release
