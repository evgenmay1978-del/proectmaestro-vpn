name: HA control-plane checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/**'
      - 'backend/internal/backuprpo/**'
      - 'backend/cmd/maestro-backup-worker/**'
      - 'ops/ha/**'
      - 'deploy/ha/**'
      - 'deploy/maestro-backup.service'
      - 'deploy/maestro-backup.timer'
      - 'deploy/maestro-backup-onchange.path'
      - 'deploy/maestro-backup.sh'
      - 'ops/ha/test-backup-systemd-policy.py'
      - 'ops/ha/tests/test_backup_systemd_policy.py'
      - 'ops/ha/tests/test_dr_workflow_policy_contract.py'
      - '.github/workflows/ha-control-plane.yml'
  push:
    branches:
      - main
      - codex/mobile-4d-deck
      - codex/yandex-cdn-whitelist-task3-sync
    paths:
      - 'backend/**'
      - 'backend/internal/backuprpo/**'
      - 'backend/cmd/maestro-backup-worker/**'
      - 'ops/ha/**'
      - 'deploy/ha/**'
      - 'deploy/maestro-backup.service'
      - 'deploy/maestro-backup.timer'
      - 'deploy/maestro-backup-onchange.path'
      - 'deploy/maestro-backup.sh'
      - 'ops/ha/test-backup-systemd-policy.py'
      - 'ops/ha/tests/test_backup_systemd_policy.py'
      - 'ops/ha/tests/test_dr_workflow_policy_contract.py'
      - '.github/workflows/ha-control-plane.yml'

permissions:
  contents: read

concurrency:
  group: ha-control-plane-${{ github.ref }}
  cancel-in-progress: false

jobs:
  go-and-rqlite:
    name: Go and isolated rqlite
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # actions/setup-go v5.6.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum

      - name: Check materialized agent boundary
        run: |
          set -euo pipefail
          python ops/ha/test-agent-payload-policy.py
          cd backend
          mapfile -d '' guarded_go_files < <(
            find internal/applyagent internal/controlplane -type f -name '*.go' -print0 |
              LC_ALL=C sort -z
          )
          mapfile -d '' noncanonical_go_files < <(
            gofmt -l "${guarded_go_files[@]}" | tr '\n' '\0' | LC_ALL=C sort -z
          )
          test "${#guarded_go_files[@]}" -gt 0
          printf '%s\0' "${noncanonical_go_files[@]}" |
            cmp - <(printf '%s\0' \
              internal/applyagent/agent.go \
              internal/applyagent/agent_test.go \
              internal/applyagent/apply_result_test.go \
              internal/applyagent/dispatcher.go \
              internal/applyagent/dispatcher_receipt_test.go \
              internal/applyagent/dispatcher_test.go \
              internal/applyagent/http.go \
              internal/applyagent/http_test.go \
              internal/applyagent/local_state.go \
              internal/applyagent/materialized.go \
              internal/applyagent/materialized_security_test.go \
              internal/applyagent/materialized_test.go \
              internal/applyagent/protocol.go \
              internal/applyagent/protocol_test.go \
              internal/applyagent/status.go \
              internal/applyagent/status_http_test.go \
              internal/applyagent/status_test.go \
              internal/controlplane/customers_test.go \
              internal/controlplane/desired_payload.go \
              internal/controlplane/migrations_test.go \
              internal/controlplane/outbox.go \
              internal/controlplane/outbox_test.go \
              internal/controlplane/restore_epoch.go \
              internal/controlplane/restore_epoch_integration_test.go \
              internal/controlplane/restore_epoch_test.go)
          gofmt -w "${guarded_go_files[@]}"
          go test ./internal/applyagent ./internal/controlplane

      - name: Check Go formatting
        working-directory: backend
        run: |
          set -euo pipefail
          gofmt -d \
            cmd/maestro-import/production_integration_test.go \
            internal/rqlite/*.go \
            internal/backuprpo/*.go \
            cmd/maestro-backup-worker/*.go |
            tee /tmp/ha-gofmt.diff
          test ! -s /tmp/ha-gofmt.diff

      - name: Test HA Python contracts
        run: |
          set -euo pipefail
          python -m unittest \
            ops.ha.tests.test_verify_backup ops.ha.tests.test_restore_api \
            ops.ha.tests.test_backup_worker \
            ops.ha.tests.test_backup_worker_security \
            ops.ha.tests.test_backup_rqlite_shell_security \
            ops.ha.tests.test_backup_worker_identity_races \
            ops.ha.tests.test_inventory \
            ops.ha.tests.test_inventory_hardening \
            ops.ha.tests.test_inventory_identity_races
          python ops/ha/test-dr-workflow-policy.py
          bash ops/ha/test-backup-rqlite.sh
          bash ops/ha/test-restore-rqlite.sh

      - name: Test durable backup adapter policy
        run: |
          set -euo pipefail
          python -m unittest ops.ha.tests.test_backup_systemd_policy ops.ha.tests.test_dr_workflow_policy_contract
          python ops/ha/test-backup-systemd-policy.py
          bash -n ops/ha/backup-rqlite.sh deploy/maestro-backup.sh

      - name: Test backend
        working-directory: backend
        run: env -u MAESTRO_S2_PASS -u MAESTRO_HY2_PASS go test -count=1 ./...

      - name: Race-test backend
        working-directory: backend
        run: env -u MAESTRO_S2_PASS -u MAESTRO_HY2_PASS go test -count=1 -race ./...

      - name: Vet backend
        working-directory: backend
        run: go vet ./...

      - name: Test rqlite harness contract
        run: |
          bash -n ops/ha/test-ci-rqlite-cluster.sh
          bash ops/ha/test-ci-rqlite-cluster.sh

      - name: Start isolated three-voter rqlite cluster
        run: bash ops/ha/ci-rqlite-cluster.sh start

      - name: Test rqlite integration
        working-directory: backend
        run: env -u MAESTRO_S2_PASS -u MAESTRO_HY2_PASS go test -count=1 -tags=rqlite_integration ./...

      - name: Reset rqlite for importer delta parity
        run: |
          bash ops/ha/ci-rqlite-cluster.sh stop
          bash ops/ha/ci-rqlite-cluster.sh start

      - name: Capture full-plus-delta digest
        working-directory: backend
        env:
          MAESTRO_IMPORT_DIGEST_PHASE: delta
          MAESTRO_IMPORT_DIGEST_PROOF: ${{ runner.temp }}/maestro-import-digest-proof
        run: go test -tags=rqlite_integration ./internal/importer -run '^TestRQLiteImportDeleteDigestPhase$' -count=1

      - name: Reset rqlite for importer fresh-full parity
        run: |
          bash ops/ha/ci-rqlite-cluster.sh stop
          bash ops/ha/ci-rqlite-cluster.sh start

      - name: Compare fresh-full digest
        working-directory: backend
        env:
          MAESTRO_IMPORT_DIGEST_PHASE: fresh
          MAESTRO_IMPORT_DIGEST_PROOF: ${{ runner.temp }}/maestro-import-digest-proof
        run: go test -tags=rqlite_integration ./internal/importer -run '^TestRQLiteImportDeleteDigestPhase$' -count=1

      - name: Reset rqlite for shadow parity
        run: |
          bash ops/ha/ci-rqlite-cluster.sh stop
          bash ops/ha/ci-rqlite-cluster.sh start

      - name: Prove redacted shadow export parity
        working-directory: backend
        env:
          MAESTRO_SHADOW_EXPORT_PROOF: "1"
        run: go test -tags=rqlite_integration ./internal/importer -run '^TestRQLiteShadowExportParity$' -count=1

      - name: Start isolated three-node mTLS rqlite cluster
        run: |
          bash ops/ha/ci-rqlite-cluster.sh stop
          bash ops/ha/ci-rqlite-cluster.sh start-mtls

      - name: Prepare production import schema over mTLS
        working-directory: backend
        env:
          MAESTRO_IMPORT_SCHEMA_PREP: "1"
        run: go test -tags=rqlite_integration ./cmd/maestro-import -run '^TestPrepareProductionImportSchemaMTLS$' -count=1

      - name: Build exact production importer binary
        working-directory: backend
        run: go build -o "${RUNNER_TEMP}/maestro-import" ./cmd/maestro-import

      - name: Prove production importer binary over mTLS
        working-directory: backend
        env:
          MAESTRO_IMPORT_BINARY: ${{ runner.temp }}/maestro-import
        run: go test -tags=rqlite_integration ./cmd/maestro-import -run '^TestProductionImportFactoryBinaryProof$' -count=1

      - name: Stop isolated rqlite cluster
        if: ${{ always() && hashFiles('ops/ha/ci-rqlite-cluster.sh') != '' }}
        run: bash ops/ha/ci-rqlite-cluster.sh stop
