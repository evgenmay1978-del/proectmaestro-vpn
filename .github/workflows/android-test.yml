name: Build app APK (test / compile-check)

# Generic NON-OTA test build of the app on a feature branch, against the NORMAL
# libbox.aar (the fleet engine). Used to compile-check + optionally device-test app
# changes before merging them to main (which is what OTAs them).
#
# ⛔ SAFETY: NO GitHub Release → the OTA mirror never sees it. APK = artifact only
# (maestrovpn-tv-test-apk). HIGH versionCode so it won't self-update mid-test.
# (ci trigger: fantasy crisp-fill-eye v12 2026-07-07)
# (ci trigger: target-1to1 — mockup medallions + status colors 2026-07-07)
# (ci trigger: target-1to1 v2 — full medallion ring + live under-glow 2026-07-07)
# (ci trigger: target-1to1 v3 — CTA gold + tile icons per mockup 2026-07-07)
# (ci trigger: target-1to1 v4 — top cartouche warm-grade + gilded ivy 2026-07-07)
# (ci trigger: target-1to1 v5 — tap-zone на орб (430,711,R228) + процедурный купол удалён (1:1 baked) 2026-07-07)
# (ci trigger: tv-eskiz unified-style swarm 2026-07-10)
# (ci trigger: tv-eskiz absolute-geometry fix 2026-07-10)
# (ci trigger: account-line + open-pay-page 2026-07-10)
# (ci trigger: tv-eskiz-redesign — ТВ-главный пиксель-в-пиксель по vpnon/vpnoff (кроп-кнопки+bg-кроссфейд) 2026-07-09)
# (ci trigger: ota-infinite-loop fix — await install verdict + versionCode compare + failure damper 2026-07-10)
# (ci trigger: ota-no-reinstall v2 — Shizuku→PACKAGE_INSTALLER fallback + foreground confirm re-fire + stale-session sweep 2026-07-10)

# (ci trigger: premium TV interface 2026-07-17)

on:
  workflow_dispatch:
    inputs:
      task:
        description: Manual task to run on the selected ref
        required: true
        default: android
        type: choice
        options:
          - android
          - mobile-eye-compile
          - mobile-eye-ring-assets
          - mobile-eye-runtime-assets
          - mobile-eye-state-preview
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/android-test.yml'
  push:
    paths:
      - .github/workflows/android-test.yml

jobs:
  mobile-eye-state-preview:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.task == 'mobile-eye-state-preview' || inputs.task == 'mobile-eye-compile') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned Pillow
        run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0'

      - name: Test eye-state behavior
        run: python -m unittest ops.test_mobile_eye_state_preview

      - name: Render OFF and ON without an APK
        run: python ops/mobile-eye-state-preview.py --scale 2

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-eye-state-preview-${{ github.sha }}
          path: |
            build/mobile-eye-state-preview/home-disconnected.png
            build/mobile-eye-state-preview/home-connected.png
            build/mobile-eye-state-preview/home-eye-states-comparison.png
          if-no-files-found: error

  mobile-eye-ring-assets:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'mobile-eye-ring-assets' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned Pillow
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'Pillow==11.3.0'
          python - <<'PY'
          import PIL
          print(f'Pillow {PIL.__version__}')
          PY

      - name: Run synthetic eye-surround contracts
        run: |
          set -euo pipefail
          python -m unittest \
            ops.test_mobile_eye_surround_assets.MobileEyeSurroundAssetsTest.test_replacement_mask_has_a_full_core_and_local_feather \
            ops.test_mobile_eye_surround_assets.MobileEyeSurroundAssetsTest.test_replacement_preserves_alpha_and_pixels_outside_circle \
            ops.test_mobile_eye_surround_assets.MobileEyeSurroundAssetsTest.test_lights_share_alpha_support_but_left_and_right_rgb_differ \
            ops.test_mobile_eye_surround_assets.MobileEyeSurroundAssetsTest.test_replacement_is_idempotent_with_feather


      - name: Verify owner-selected closed-eye inputs and preview contracts
        run: |
          set -euo pipefail
          python ops/mobile-eye-surround-assets.py --material-only --check
          python -m unittest ops.test_mobile_eye_surround_assets.MobileEyeSurroundAssetsIntegrationTest.test_archived_owner_reference_rebuilds_the_tracked_master ops.test_mobile_eye_state_preview
      - name: Render and verify full-size ring outputs
        run: |
          set -euo pipefail
          python ops/mobile-eye-surround-assets.py
          python ops/mobile-eye-surround-assets.py --check
          python -m unittest ops.test_mobile_eye_surround_assets
          python ops/mobile-4d-art-check.py --selftest
          python ops/mobile-4d-art-check.py --group ring
          git diff --check

      - name: Record decoded RGBA and alpha digests
        run: |
          set -euo pipefail
          mkdir -p build/mobile-eye-ring-assets
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from PIL import Image

          root = Path('.')
          report = []
          for directory in ('kit', 'source'):
              for light in ('l', 'c', 'r'):
                  path = root / 'design/mobile-asset-redraw' / directory / f'home_ring_{light}.png'
                  with Image.open(path) as source:
                      rgba = source.convert('RGBA')
                  report.append(
                      f'{path.as_posix()} '
                      f'rgba={hashlib.sha256(rgba.tobytes()).hexdigest()} '
                      f'alpha={hashlib.sha256(rgba.getchannel("A").tobytes()).hexdigest()} '
                      f'size={rgba.width}x{rgba.height}'
                  )
          output = '\n'.join(report) + '\n'
          Path('build/mobile-eye-ring-assets/decoded-rgba-sha256.txt').write_text(
              output,
              encoding='utf-8',
          )
          print(output, end='')
          PY

      - name: Upload generated ring assets (artifact only)
        uses: actions/upload-artifact@v4
        with:
          name: mobile-eye-ring-assets-${{ github.sha }}
          path: |
            design/mobile-asset-redraw/kit/home_ring_l.png
            design/mobile-asset-redraw/kit/home_ring_c.png
            design/mobile-asset-redraw/kit/home_ring_r.png
            design/mobile-asset-redraw/source/home_ring_l.png
            design/mobile-asset-redraw/source/home_ring_c.png
            design/mobile-asset-redraw/source/home_ring_r.png
            build/mobile-eye-ring-assets/decoded-rgba-sha256.txt
          if-no-files-found: error

  mobile-eye-runtime-assets:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'mobile-eye-runtime-assets' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned Pillow
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'Pillow==11.3.0'
          python - <<'PY'
          import PIL
          print(f'Pillow {PIL.__version__}')
          PY

      - name: RED gate - require owner-approved runtime eye geometry
        run: python ops/phone-screen-sim.py --eye-phases-only

      - name: Verify source and atlas-generator contracts
        run: |
          set -euo pipefail
          python -m unittest ops.test_mobile_4d_assets
          python ops/mobile-eye-surround-assets.py --check

      - name: Record pre-generation manifest digest
        run: |
          set -euo pipefail
          mkdir -p build/mobile-eye-runtime-assets
          sha256sum \
            app/src/main/java/com/maestrovpn/tv/compose/screen/tvhome/Mobile4DGeneratedAssets.kt \
            > build/mobile-eye-runtime-assets/manifest-before.sha256

      - name: Regenerate and verify deterministic runtime atlases
        run: |
          set -euo pipefail
          python ops/mobile-4d-assets.py
          python ops/mobile-4d-assets.py --check

      - name: Verify ring art contracts
        run: |
          set -euo pipefail
          python ops/mobile-4d-art-check.py --selftest
          python ops/mobile-4d-art-check.py --group ring

      - name: Render full phone simulator
        run: python ops/phone-screen-sim.py

      - name: Require only six atlas changes and write SHA-256 report
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          manifest = Path(
              'app/src/main/java/com/maestrovpn/tv/compose/screen/tvhome/'
              'Mobile4DGeneratedAssets.kt'
          )
          expected_atlases = {
              Path(f'app/src/main/assets/mobile_4d/atlas_{light}_{page:02d}.webp')
              for light in ('l', 'c', 'r')
              for page in (7, 8)
          }
          changed = {
              Path(line)
              for line in subprocess.check_output(
                  [
                      'git', 'diff', '--name-only', '--',
                      'app/src/main/assets/mobile_4d', str(manifest),
                  ],
                  text=True,
              ).splitlines()
              if line
          }
          if changed and changed != expected_atlases:
              missing = sorted(str(path) for path in expected_atlases - changed)
              unexpected = sorted(str(path) for path in changed - expected_atlases)
              raise SystemExit(
                  'runtime atlas scope drift: expected exactly six changed pages or '
                  f'a clean verification run; missing={missing or "none"}; '
                  f'unexpected={unexpected or "none"}'
              )
          atlas_status = 'generated' if changed else 'verified'

          before_line = Path(
              'build/mobile-eye-runtime-assets/manifest-before.sha256'
          ).read_text(encoding='utf-8').strip()
          before_sha = before_line.split()[0]
          after_sha = hashlib.sha256(manifest.read_bytes()).hexdigest()
          if before_sha != after_sha:
              raise SystemExit(
                  'generated manifest changed despite stable alpha/placement: '
                  f'before={before_sha}; after={after_sha}'
              )

          qa_outputs = (
              Path('build/phone-screen-sim/owner-eye-blink-phases.png'),
              Path('build/phone-screen-sim/owner-eye-blink-phases-qa.jpg'),
              Path('build/phone-screen-sim/owner-home-comparison.png'),
              Path('build/phone-screen-sim/owner-home-comparison-qa.jpg'),
              Path('build/phone-screen-sim/phone-screens.png'),
              Path('build/phone-screen-sim/phone-screens-qa.jpg'),
          )
          expected_outputs = tuple(sorted(expected_atlases)) + qa_outputs
          missing_outputs = [str(path) for path in expected_outputs if not path.is_file()]
          if missing_outputs:
              raise SystemExit(f'missing runtime QA outputs: {missing_outputs}')

          report_lines = [
              f'status={atlas_status}',
              f'manifest_sha256={after_sha}',
              'changed_files:',
              *(f'  {path.as_posix()}' for path in sorted(changed)),
              'artifact_sha256:',
          ]
          for path in expected_outputs:
              report_lines.append(
                  f'  {hashlib.sha256(path.read_bytes()).hexdigest()}  '
                  f'{path.as_posix()}  bytes={path.stat().st_size}'
              )
          report = '\n'.join(report_lines) + '\n'
          Path(
              'build/mobile-eye-runtime-assets/runtime-assets-report.txt'
          ).write_text(report, encoding='utf-8')
          print(report, end='')
          PY
          git diff --check

      - name: Upload runtime eye atlases and visual QA (artifact only)
        uses: actions/upload-artifact@v4
        with:
          name: mobile-eye-runtime-assets-${{ github.sha }}
          path: |
            app/src/main/assets/mobile_4d/atlas_l_07.webp
            app/src/main/assets/mobile_4d/atlas_l_08.webp
            app/src/main/assets/mobile_4d/atlas_c_07.webp
            app/src/main/assets/mobile_4d/atlas_c_08.webp
            app/src/main/assets/mobile_4d/atlas_r_07.webp
            app/src/main/assets/mobile_4d/atlas_r_08.webp
            build/phone-screen-sim/owner-eye-blink-phases.png
            build/phone-screen-sim/owner-eye-blink-phases-qa.jpg
            build/phone-screen-sim/owner-home-comparison.png
            build/phone-screen-sim/owner-home-comparison-qa.jpg
            build/phone-screen-sim/phone-screens.png
            build/phone-screen-sim/phone-screens-qa.jpg
            build/mobile-eye-runtime-assets/runtime-assets-report.txt
          if-no-files-found: error

  build:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.task == 'android' || inputs.task == 'mobile-eye-compile' }}
    runs-on: ubuntu-latest
    # The repo default token permission is "read", which does NOT include actions:read — so
    # `gh run list --workflow=libbox.yml` (the libbox.aar fetch below) failed with
    # "HTTP 403: Resource not accessible by integration" and the job died before compiling
    # anything (run 30406565486, 2026-07-28). Grant it explicitly.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Set test version (HIGH code so the OTA never replaces it)
        if: ${{ inputs.task != 'mobile-eye-compile' }}
        id: ver
        run: |
          set -euo pipefail
          VC="$(( 90000 + ${{ github.run_number }} ))"
          VN="1.0.92-test"
          sed -i -E "s/^VERSION_CODE=.*/VERSION_CODE=${VC}/" version.properties
          sed -i -E "s/^VERSION_NAME=.*/VERSION_NAME=${VN}/" version.properties

      - name: Read NDK pin from version.properties
        id: pin
        run: |
          set -euo pipefail
          source <(grep -E '^NDK_VERSION=' version.properties)
          echo "ndk_version=${NDK_VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'settings.gradle.kts', 'version.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install pinned NDK + SDK platform
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;${{ steps.pin.outputs.ndk_version }}" "platforms;android-36" "build-tools;36.0.0" >/dev/null
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${{ steps.pin.outputs.ndk_version }}" >> "$GITHUB_ENV"

      - name: Fetch the NORMAL libbox.aar (latest successful libbox.yml run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p app/libs
          RUN_ID=$(gh run list --workflow=libbox.yml --status=success -L1 \
            --json databaseId -q '.[0].databaseId // empty')
          [ -n "$RUN_ID" ] || { echo "::error::No successful libbox.yml build found." >&2; exit 1; }
          gh run download "$RUN_ID" -n libbox-aar -D app/libs
          test -f app/libs/libbox.aar
          ls -lh app/libs/

      - name: Fetch olcrtc android binaries → jniLibs (option-b; NON-FATAL)
        if: ${{ inputs.task != 'mobile-eye-compile' }}
        # Option-b ships olcRTC as a separate-process native binary in jniLibs/<abi>/libolcrtc.so
        # (NOT the old gomobile .aar, which collided with libbox's go.* runtime). Non-fatal so a
        # broken olcrtc-bin.yml never blocks the app compile-check.
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          set -euo pipefail
          RUN_ID=$(gh run list --workflow=olcrtc-bin.yml --status=success -L1 \
            --json databaseId -q '.[0].databaseId // empty')
          [ -n "$RUN_ID" ] || { echo "::warning::No successful olcrtc-bin.yml run — compiling without the binary." >&2; exit 0; }
          gh run download "$RUN_ID" -n olcrtc-bin -D olcrtc-bin
          for abi in arm64-v8a armeabi-v7a; do
            [ -f "olcrtc-bin/libolcrtc-${abi}.so" ] || continue
            mkdir -p "app/src/main/jniLibs/${abi}"
            cp "olcrtc-bin/libolcrtc-${abi}.so" "app/src/main/jniLibs/${abi}/libolcrtc.so"
          done
          ls -lhR app/src/main/jniLibs/ 2>/dev/null || true

      - name: Fetch WDTT mobile transport binaries → jniLibs (required)
        if: ${{ inputs.task != 'mobile-eye-compile' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID=$(gh run list --workflow=wdtt-bin.yml --status=success -L1 --json databaseId -q '.[0].databaseId // empty')
          [ -n "$RUN_ID" ] || { echo "::error::No successful wdtt-bin.yml artifact." >&2; exit 1; }
          gh run download "$RUN_ID" -n wdtt-bin -D wdtt-bin
          source <(grep -E '^WDTT_REF=' version.properties)
          test "$(cat wdtt-bin/WDTT_UPSTREAM_COMMIT)" = "$WDTT_REF"
          (cd wdtt-bin && sha256sum -c wdtt-sha256.txt)
          for abi in arm64-v8a armeabi-v7a; do
            test -s "wdtt-bin/libwdtt-${abi}.so"
            mkdir -p "app/src/main/jniLibs/${abi}"
            cp "wdtt-bin/libwdtt-${abi}.so" "app/src/main/jniLibs/${abi}/libwdtt.so"
          done

      - name: Materialize the stable signing keystore from secret
        if: ${{ inputs.task != 'mobile-eye-compile' }}
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${SIGNING_KEYSTORE_B64:-}" ]; then
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > app/release.keystore
          fi

      - name: Build :app:assembleOtherDebug
        if: ${{ inputs.task != 'mobile-eye-compile' }}
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          # Preserve the first failure; retry only after its cause is corrected.
          ./gradlew :app:assembleOtherDebug --stacktrace --no-daemon

      # Та же причина, что в android.yml: выгрузка — удобство, а не результат гейта. Пока квота
      # артефактов выбрана, её падение уводило ИДУЩИЕ ПОСЛЕ unit-тесты в skipped, и гейт переставал
      # проверять то, ради чего существует. Сборка и тесты остаются блокирующими.
      - name: Upload test APK (artifact only — NO Release, NO OTA)
        if: ${{ inputs.task != 'mobile-eye-compile' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: maestrovpn-tv-test-apk
          path: app/build/outputs/apk/other/debug/*.apk
          if-no-files-found: error

      # The repo has unit tests (MaestroSubTest, WdttManagerTest, WdttVpnPolicyTest,
      # ProtocolLabelTest) that no workflow has ever executed — this job only ever ran
      # assembleOtherDebug, so they were dead weight. Run them AFTER the APK upload so a test
      # failure can never cost us the artifact we came here for.
      #
      # Gating: run 30167294888 (2026-07-25) was the first time these ever executed anywhere and
      # all of them passed, so a failure from here on is a real regression, not unknown ground.
      # Compile the existing app/test Kotlin and exercise only the eye contract.
      # No deferred-transport binaries, keystore, APK, Release or OTA in this mode.
      - name: Eye geometry compile and unit test (no APK)
        if: ${{ inputs.task == 'mobile-eye-compile' }}
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testOtherDebugUnitTest --tests '*LivingEyeLayerGeometryTest' --stacktrace --no-daemon

      - name: Unit tests
        if: ${{ inputs.task != 'mobile-eye-compile' }}
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: ./gradlew :app:testOtherDebugUnitTest --stacktrace --no-daemon

      - name: Upload unit-test report
        if: always()
        continue-on-error: true # тоже выгрузка: не должна ронять гейт из-за квоты артефактов
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testOtherDebugUnitTest/
          if-no-files-found: ignore

